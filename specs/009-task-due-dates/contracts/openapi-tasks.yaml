openapi: 3.1.0
info:
  title: Task Due Dates & Deadlines API
  version: 1.0.0
  description: |
    RESTful API endpoints for managing tasks with due date support.
    Extends existing Task API with due_date field, sorting/filtering by due date,
    and computed due status indicators.

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/{user_id}/tasks:
    get:
      summary: List all tasks for a user with optional sorting and filtering
      operationId: listTasks
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [due_date, "-due_date"]
          description: Sort by due date (ascending or descending)
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [overdue, due_today, upcoming]
          description: Filter tasks by due date status
      responses:
        200:
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        401:
          description: Unauthorized (invalid or missing JWT token)
        500:
          description: Internal server error

    post:
      summary: Create a new task with optional due date
      operationId: createTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        201:
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized (invalid or missing JWT token)
        500:
          description: Internal server error

  /api/{user_id}/tasks/{id}:
    get:
      summary: Get a single task by ID
      operationId: getTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task ID
      responses:
        200:
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        401:
          description: Unauthorized (invalid or missing JWT token)
        403:
          description: Forbidden (task owned by another user)
        404:
          description: Task not found
        500:
          description: Internal server error

    put:
      summary: Update a task, including due date
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        200:
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized (invalid or missing JWT token)
        403:
          description: Forbidden (task owned by another user)
        404:
          description: Task not found
        500:
          description: Internal server error

    delete:
      summary: Delete a task
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID from JWT token
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Task ID
      responses:
        204:
          description: Task deleted successfully
        401:
          description: Unauthorized (invalid or missing JWT token)
        403:
          description: Forbidden (task owned by another user)
        404:
          description: Task not found
        500:
          description: Internal server error

components:
  schemas:
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title (required)
        description:
          type: string
          maxLength: 5000
          nullable: true
          description: Extended task description (optional)
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
          description: Task priority level (optional, defaults to medium)
        due_date:
          type: string
          format: date
          nullable: true
          description: Task due date in ISO 8601 format (YYYY-MM-DD), optional

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Task title (optional)
        description:
          type: string
          maxLength: 5000
          nullable: true
          description: Extended task description (optional)
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority level (optional)
        due_date:
          type: string
          format: date
          nullable: true
          description: Task due date in ISO 8601 format (optional, set to null to clear)

    TaskResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - status
        - priority
        - due_date
        - is_overdue
        - is_due_today
        - days_until_due
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Unique task identifier
        user_id:
          type: string
          description: Owner of the task
        title:
          type: string
          description: Task title
        description:
          type: string
          nullable: true
          description: Extended task description
        status:
          type: string
          enum: [incomplete, complete]
          description: Task completion status
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority level
        due_date:
          type: string
          format: date
          nullable: true
          description: Task due date in ISO 8601 format (YYYY-MM-DD)
        is_overdue:
          type: boolean
          description: True if task has a due_date in the past
        is_due_today:
          type: boolean
          description: True if task is due today
        days_until_due:
          type: integer
          nullable: true
          description: Number of days until due date (null if no due_date, negative if overdue)
        created_at:
          type: string
          format: date-time
          description: Task creation timestamp (UTC)
        updated_at:
          type: string
          format: date-time
          description: Task last update timestamp (UTC)

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing what went wrong

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token issued by Better Auth authentication system.
        Include in Authorization header: Authorization: Bearer <token>

security:
  - bearerAuth: []

tags:
  - name: Tasks
    description: Task management operations including due date support
